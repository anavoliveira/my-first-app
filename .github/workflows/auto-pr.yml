name: Auto Pull Request

# Ativa em qualquer push, exceto para main (main só recebe PR via develop)
on:
  push:
    branches-ignore:
      - main

# Permissões mínimas necessárias para criar PRs via GITHUB_TOKEN
permissions:
  pull-requests: write
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Qualquer branch (exceto develop e main) → develop
  # Abre um PR assim que um push chega numa branch de feature/fix.
  # ─────────────────────────────────────────────────────────────
  pr-to-develop:
    name: Abrir PR → develop
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar PR para develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          # Verificar se já existe um PR aberto para esse par de branches
          EXISTING=$(gh pr list \
            --base develop \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING já existe para $BRANCH → develop. Nada a fazer."
          else
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$BRANCH → develop" \
              --body "$(cat <<EOF
## PR automático

Integra a branch \`$BRANCH\` em \`develop\`.

### Checklist
- [ ] Código revisado
- [ ] Build de simulador passando
- [ ] Sem conflitos com develop
EOF
)"
            echo "PR criado: $BRANCH → develop"
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — develop → main
  # Abre um PR de release assim que um push chega em develop.
  # ─────────────────────────────────────────────────────────────
  pr-to-main:
    name: Abrir PR develop → main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar PR develop → main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verificar se já existe um PR aberto de develop para main
          EXISTING=$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING já existe para develop → main. Nada a fazer."
          else
            gh pr create \
              --base main \
              --head develop \
              --title "release: develop → main" \
              --body "$(cat <<EOF
## Release automática

Integra \`develop\` em \`main\` para publicar nova versão no TestFlight.

### Checklist
- [ ] Todos os PRs da sprint mergeados em develop
- [ ] Build de simulador passando
- [ ] Versão e build number atualizados no projeto
- [ ] Build testado via TestFlight (develop)
EOF
)"
            echo "PR criado: develop → main"
          fi
