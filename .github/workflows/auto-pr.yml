name: Auto Pull Request

on:
  push:
    branches-ignore:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-to-develop:
    name: Abrir PR → develop
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar PR para develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          EXISTING=$(gh pr list \
            --base develop \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING já existe para $BRANCH → develop."
          else
            BODY="## PR automático

          Integra a branch \`$BRANCH\` em \`develop\`.

          ### Checklist
          - [ ] Código revisado
          - [ ] Build de simulador passando
          - [ ] Sem conflitos com develop"

            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$BRANCH → develop" \
              --body "$BODY"
            echo "PR criado: $BRANCH → develop"
          fi

  pr-to-main:
    name: Abrir PR develop → main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar PR develop → main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING já existe para develop → main."
          else
            BODY="## Release automática

          Integra \`develop\` em \`main\` para publicar nova versão no TestFlight.

          ### Checklist
          - [ ] Todos os PRs da sprint mergeados em develop
          - [ ] Build de simulador passando
          - [ ] Versão e build number atualizados no projeto
          - [ ] Build testado via TestFlight (develop)"

            gh pr create \
              --base main \
              --head develop \
              --title "release: develop → main" \
              --body "$BODY"
            echo "PR criado: develop → main"
          fi
