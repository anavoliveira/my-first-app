name: iOS Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Variáveis globais reutilizadas nos dois jobs
env:
  PROJECT: MyApp.xcodeproj
  SCHEME: MyApp

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Build rápido para validação (simulador, sem assinatura)
  # Roda em todo push e PR para garantir que o código compila.
  # ─────────────────────────────────────────────────────────────
  build-simulator:
    name: Build (Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Compilar para simulador iOS
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publicar artefato do simulador
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-simulator
          path: build/Build/Products/Debug-iphonesimulator/MyApp.app
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Assinar, arquivar e enviar ao TestFlight
  # Só roda quando há push direto na branch main (não em PRs).
  # Depende do job 1 ter passado antes de executar.
  # ─────────────────────────────────────────────────────────────
  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-15
    needs: build-simulator
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # ── Certificado de distribuição ──────────────────────────
      # Decodifica o .p12 em base64, cria um keychain temporário
      # e importa o certificado para que o xcodebuild consiga
      # assinar o app durante o archive.
      - name: Instalar certificado Apple Distribution
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decodificar o certificado salvo no secret
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          # Criar keychain temporário isolado (não afeta o sistema)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Importar o certificado no keychain temporário
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Tornar o keychain temporário ativo para o xcodebuild
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # ── Provisioning Profile ─────────────────────────────────
      # O perfil diz quais dispositivos / distribuição são
      # permitidos e qual certificado pode assinar o app.
      - name: Instalar Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── Chave da API do App Store Connect ────────────────────
      # A chave .p8 permite autenticar com a Apple sem precisar
      # de Apple ID + senha 2FA, ideal para automação.
      - name: Configurar App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      # ── Archive ──────────────────────────────────────────────
      # xcodebuild archive compila para dispositivo real (iphoneos)
      # e gera um .xcarchive com o app + símbolos de debug.
      - name: Gerar archive (.xcarchive)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MyApp.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      # ── Export + Upload ───────────────────────────────────────
      # xcodebuild -exportArchive lê o ExportOptions.plist,
      # empacota o .ipa e, com destination=upload, envia direto
      # ao App Store Connect (fila do TestFlight).
      - name: Exportar IPA e enviar ao TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Substituir o placeholder do Team ID no ExportOptions
          sed "s/YOUR_TEAM_ID/${TEAM_ID}/" ExportOptions.plist \
            > "$RUNNER_TEMP/ExportOptions.resolved.plist"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/MyApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.resolved.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath \
              ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      # ── Limpeza ───────────────────────────────────────────────
      # Remover chaves e certificados da memória do runner.
      # "if: always()" garante que roda mesmo se etapas anteriores falharem.
      - name: Limpar arquivos sensíveis
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
